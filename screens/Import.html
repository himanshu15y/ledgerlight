<!doctype html>
<html lang="en">
<head>

<title>Import and data checks · Ledgerlight prototype</title>
<style>
body{margin:0}
a{color:#0B6E73}a:hover{color:#08575B}
</style>
<style>
html{background:#E4EAE8}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0 32px;box-sizing:border-box;
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
.ll-bar{width:390px;max-width:100%;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#3F4B49}
.ll-bar a{color:#0B6E73;text-decoration:none;font-weight:600}
.ll-phone{border-radius:28px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 40px rgba(16,40,38,.18);background:#F2F5F4}
@media (max-width:420px){body{padding:0}.ll-bar{padding:10px 12px;box-sizing:border-box}.ll-phone{border-radius:0;box-shadow:none}}
html.thumb,html.thumb body{background:#F2F5F4;padding:0;display:block;min-height:0}
html.thumb .ll-bar{display:none}
/* Rows inside the scrolling main must keep their height (chip rows use overflow-x). */
.ll-phone main > *{flex-shrink:0}
html.thumb .ll-phone{border-radius:0;box-shadow:none}
</style>
<script>if(location.hash==='#thumb')document.documentElement.classList.add('thumb')</script>
</head>
<body>
<div class="ll-bar"><a href="../index.html">← All screens</a><span>Import and data checks</span></div>
<div class="ll-phone">
<template id="ll-tpl"><div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F5F4; color: #15201F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #D9E0DE; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; border-radius: 6px; background: #0B6E73; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">₹</span>
      <a href="More.html" aria-label="Back" style="flex: none; width: 36px; height: 40px; margin-left: -6px; display: flex; align-items: center; justify-content: center; color: #15201F; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
      <h1 style="margin: 0; flex-grow: 1; min-width: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Import</h1>
    </div>
    
  </header>
  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <sc-if value="{{msg}}" hint-placeholder-val="{{ false }}"><div role="status" style="font-size: 13px; padding: 10px 12px; border-radius: 8px; background: #15201F; color: #F2F5F4">{{msg}}</div></sc-if>
    <section style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0"><div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 16px">Data checks</h2>
        <button type="button" onClick="{{run}}" style="border: 0; border-radius: 9px; padding: 5px 10px; font: inherit; font-size: 12px; font-weight: 600; background: #E8EDEB; color: #15201F">Run again</button></div>
      <p style="margin: 0; font-size: 13px; color: #5B6967">The whole ledger is checked on this computer: balances day by day, statement totals, missing months, card bills with no other side, duplicates.</p>
      <div style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; overflow: hidden"><div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; "><span><span style="display: block; font-weight: 500">Test Bank Platinum</span><span style="font-size: 12px; color: #5B6967">60 records · 2 Jul – 30 Sep</span></span><span style="font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: .03em; background: #E0EFE6; color: #24794A">OK</span></div><div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid #D9E0DE;"><span><span style="display: block; font-weight: 500">Test Bank Savings</span><span style="font-size: 12px; color: #5B6967">84 records · 1 Jul – 28 Sep</span></span><span style="font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: .03em; background: #E0EFE6; color: #24794A">OK</span></div><div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid #D9E0DE;"><span><span style="display: block; font-weight: 500">Test Bank Rewards</span><span style="font-size: 12px; color: #5B6967">68 records · 3 Jul – 29 Sep</span></span><span style="font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: .03em; background: #E0EFE6; color: #24794A">OK</span></div><div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid #D9E0DE;"><span><span style="display: block; font-weight: 500">Other Bank Credit Card</span><span style="font-size: 12px; color: #5B6967">34 records · 8 Jul – 29 Sep</span></span><span style="font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: .03em; background: #E0EFE6; color: #24794A">OK</span></div></div>
      <div role="group" style="display: flex; flex-wrap: wrap; gap: 3px; background: #E8EDEB; border-radius: 9px; padding: 3px"><sc-for list="{{tabs}}" as="s" hint-placeholder-count="4"><button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="flex-grow: 1; border: 0; border-radius: 7px; padding: 7px 10px; font: inherit; font-size: 13px; font-weight: 500; color: #15201F; background: {{s.bg}}; box-shadow: {{s.shadow}}">{{s.label}}</button></sc-for></div>
      <div style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; overflow: hidden">
        <sc-for list="{{finds}}" as="f" hint-placeholder-count="1"><div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 12px">
          <span><span style="display: block; font-weight: 500">{{f.title}}</span><span style="font-size: 12px; color: #5B6967">{{f.detail}}</span></span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><span style="font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: #E8EDEB; color: #5B6967">{{f.badge}}</span><a href="Records.html" style="display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 9px; padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 600; background: #E8EDEB; color: #15201F; text-decoration: none; white-space: nowrap">See records</a></span></div></sc-for>
        <sc-if value="{{noFinds}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 12px; font-size: 14px; color: #5B6967">Nothing here.</p></sc-if>
      </div></section>
    <label style="display: block; border: 2px dashed #D9E0DE; border-radius: 10px; padding: 28px 16px; text-align: center; background: #FFFFFF; cursor: pointer">
      <input type="file" multiple accept=".csv,.xls,.xlsx,.pdf" onChange="{{picked}}" style="position: absolute; opacity: 0; width: 1px; height: 1px">
      <span style="color: #0B6E73"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3"/></svg></span>
      <span style="display: block; font-weight: 600; margin-top: 6px">Add statements</span>
      <span style="display: block; font-size: 13px; color: #5B6967">CSV, XLS or PDF · many files at once · from Files on iPhone</span></label>
    <div style="font-size: 13px; padding: 10px 12px; border-radius: 8px; background: #E8EDEB; color: #5B6967">Files stay on this server in <span style='font-family: ui-monospace, SF Mono, Menlo, monospace; font-size: 12px'>data/raw_layer/</span>. A PDF password you type here is used once and is not saved. To save passwords, use Settings.</div>
    <section style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; overflow: hidden"><div style="padding: 14px 14px 6px"><div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700">Imported files</h2><span style="font-size: 12px; color: #5B6967; text-align: right">4</span></div></div><div style="display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 12px; padding: 12px; "><span style="grid-row: 1 / span 3; width: 40px; height: 44px; border-radius: 6px; background: #E8EDEB; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; color: #5B6967">XLS</span><span style="font-weight: 500; overflow-wrap: anywhere">demo_testbank_savings.xls</span><span style="display: flex; gap: 6px; align-items: center; font-size: 13px"><span style="font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: .03em; background: #E0EFE6; color: #24794A">IMPORTED</span><span style="color: #5B6967">Test Bank Savings</span></span><span style="font-size: 13px; color: #5B6967">84 new · 0 duplicate · 2026-10-20 08:53</span></div><div style="display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 12px; padding: 12px; border-top: 1px solid #D9E0DE;"><span style="grid-row: 1 / span 3; width: 40px; height: 44px; border-radius: 6px; background: #E8EDEB; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; color: #5B6967">PDF</span><span style="font-weight: 500; overflow-wrap: anywhere">demo_card_0001.pdf</span><span style="display: flex; gap: 6px; align-items: center; font-size: 13px"><span style="font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: .03em; background: #E0EFE6; color: #24794A">IMPORTED</span><span style="color: #5B6967">Test Bank Platinum</span></span><span style="font-size: 13px; color: #5B6967">60 new · 0 duplicate · 2026-10-20 08:53</span></div><div style="display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 12px; padding: 12px; border-top: 1px solid #D9E0DE;"><span style="grid-row: 1 / span 3; width: 40px; height: 44px; border-radius: 6px; background: #E8EDEB; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; color: #5B6967">PDF</span><span style="font-weight: 500; overflow-wrap: anywhere">demo_card_0002.pdf</span><span style="display: flex; gap: 6px; align-items: center; font-size: 13px"><span style="font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: .03em; background: #E0EFE6; color: #24794A">IMPORTED</span><span style="color: #5B6967">Test Bank Rewards</span></span><span style="font-size: 13px; color: #5B6967">68 new · 0 duplicate · 2026-10-20 08:53</span></div><div style="display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 12px; padding: 12px; border-top: 1px solid #D9E0DE;"><span style="grid-row: 1 / span 3; width: 40px; height: 44px; border-radius: 6px; background: #E8EDEB; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; color: #5B6967">PDF</span><span style="font-weight: 500; overflow-wrap: anywhere">demo_card_0003.pdf</span><span style="display: flex; gap: 6px; align-items: center; font-size: 13px"><span style="font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: .03em; background: #E0EFE6; color: #24794A">IMPORTED</span><span style="color: #5B6967">Other Bank Credit Card</span></span><span style="font-size: 13px; color: #5B6967">34 new · 0 duplicate · 2026-10-20 08:53</span></div></section>
  </main>
  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #D9E0DE; padding: 4px 2px 20px"><a href="Home.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Home</a><a href="Records.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>Records</a><a href="Inbox.html" aria-label="Inbox, 4 items" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h5l1.5 3h5l1.5-3h5M5.5 5h13L21 13v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/></svg><span aria-hidden="true" style="position: absolute; top: -4px; left: 14px; min-width: 17px; height: 17px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #9A6212; color: #FFFFFF; font-size: 10px; font-weight: 700; line-height: 17px; text-align: center">4</span></span>Inbox</a><a href="Main.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg></span>Ask</a><a href="More.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #0B6E73; font-weight: 600"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span>More</a></nav>
</div></template>
<script type="text/plain" id="ll-logic" data-props='{}'>
class Component extends DCLogic {
  state = { t: 'info', msg: '' };
  seg(list, cur, key) {
    return list.map(([k, l]) => ({ label: l, on: String(k === cur), bg: k === cur ? '#FFFFFF' : 'transparent',
      shadow: k === cur ? '0 1px 2px rgba(0,0,0,.12)' : 'none', pick: () => this.setState({ [key]: k }) }));
  }
  renderVals() {
    const s = this.state, F = [{"sev": "info", "title": "27 records without a category", "detail": "They count in totals as Uncategorized. Answer them on the Review page."}], n = k => F.filter(f => f.severity === k || f.sev === k).length;
    const finds = F.filter(f => s.t === 'all' || f.sev === s.t).map(f => ({ ...f, badge: { error: 'PROBLEM', warn: 'CHECK', info: 'INFO' }[f.sev] }));
    return { tabs: this.seg([['error', 'Problems ' + n('error')], ['warn', 'Checks ' + n('warn')], ['info', 'Info ' + n('info')], ['all', 'All']], s.t, 't'),
      finds, noFinds: !finds.length, msg: s.msg, run: () => this.setState({ msg: 'Checks done.' }),
      picked: () => this.setState({ msg: 'In the app the file imports here and shows: new records, duplicates and the totals check.' }) };
  }
}
</script>
<div id="ll-root"></div>
<script src="../assets/ll-runtime.js"></script>
</div>
</body>
</html>
