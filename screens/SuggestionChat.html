<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suggestion chat · Ledgerlight prototype</title>
<style>
body{margin:0}
a{color:#0B6E73}a:hover{color:#08575B}
</style>
<style>
html{background:#E4EAE8}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0 32px;box-sizing:border-box;
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
.ll-bar{width:390px;max-width:100%;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#3F4B49}
.ll-bar a{color:#0B6E73;text-decoration:none;font-weight:600}
.ll-phone{border-radius:28px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 40px rgba(16,40,38,.18);background:#F2F5F4}
@media (max-width:420px){body{padding:0}.ll-bar{padding:10px 12px;box-sizing:border-box}.ll-phone{border-radius:0;box-shadow:none}}
html.thumb,html.thumb body{background:#F2F5F4;padding:0;display:block;min-height:0}
html.thumb .ll-bar{display:none}
/* Rows inside the scrolling main must keep their height (chip rows use overflow-x). */
.ll-phone main > *{flex-shrink:0}
html.thumb .ll-phone{border-radius:0;box-shadow:none}
</style>
<script>if(location.hash==='#thumb')document.documentElement.classList.add('thumb')</script>
</head>
<body>
<div class="ll-bar"><a href="../index.html">← All screens</a><span>Suggestion chat</span></div>
<div class="ll-phone">
<template id="ll-tpl"><div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F5F4; color: #15201F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #D9E0DE; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; border-radius: 6px; background: #0B6E73; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">₹</span>
      <a href="Suggestions.html" aria-label="Back" style="flex: none; width: 36px; height: 40px; margin-left: -6px; display: flex; align-items: center; justify-content: center; color: #15201F; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
      <h1 style="margin: 0; flex-grow: 1; min-width: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Chat</h1>
    </div>
    
  </header>
  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <section style="background: #F7F5FD; border: 1px solid #C9C2E6; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; color: #5B4BA8">Category</span>
      <span style="font-size: 15px; font-weight: 500">Put Sri Dunmore Stores in Groceries</span>
      <sc-if value="{{done}}" hint-placeholder-val="{{ false }}"><span style="color: #24794A; font-weight: 500">✓ {{done}}</span></sc-if>
      <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
        <button type="button" onClick="{{accept}}" style="border: 0; border-radius: 9px; padding: 9px 14px; font: inherit; font-size: 14px; font-weight: 600; background: #0B6E73; color: #FFFFFF">Groceries</button>
        <a href="Records.html" style="display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 9px; padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 600; background: #E8EDEB; color: #15201F; text-decoration: none; white-space: nowrap">See records</a>
        <a href="Suggestions.html" style="margin-left: auto; font-size: 14px; color: #5B6967; text-decoration: none; padding: 8px">Dismiss</a></div></sc-if>
    </section>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{thread}}" as="m" hint-placeholder-count="2">
        <sc-if value="{{m.me}}" hint-placeholder-val="{{ false }}"><div style="align-self: flex-end; max-width: 85%; background: #D4ECE6; border-radius: 14px 14px 4px 14px; padding: 10px 13px; white-space: pre-wrap">{{m.text}}</div></sc-if>
        <sc-if value="{{m.ai}}" hint-placeholder-val="{{ true }}"><div style="align-self: flex-start; max-width: 88%; background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 14px 14px 14px 4px; padding: 10px 13px; white-space: pre-wrap">{{m.text}}</div></sc-if>
        <sc-if value="{{m.ev}}" hint-placeholder-val="{{ false }}"><div style="max-width: 88%; background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; overflow: hidden">
          <sc-for list="{{evidence}}" as="r" hint-placeholder-count="3"><div style="display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-top: {{r.border}}"><span><span style="display: block; font-weight: 500">{{r.name}}</span><span style="font-size: 12px; color: #5B6967">{{r.date}}</span></span><span style="font-weight: 600; font-variant-numeric: tabular-nums">{{r.amt}}</span></div></sc-for>
          <a href="Records.html" style="display: block; padding: 9px 12px; border-top: 1px solid #D9E0DE; font-size: 13px; font-weight: 600; text-decoration: none">See all 15 in Records</a></div></sc-if>
      </sc-for>
    </div>
    <sc-if value="{{hasChips}}" hint-placeholder-val="{{ true }}"><div role="group" aria-label="Ask next" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="3"><button type="button" onClick="{{c.ask}}" style="border: 1px solid #D9E0DE; background: #FFFFFF; border-radius: 99px; padding: 6px 13px; font: inherit; font-size: 13px; color: #15201F">{{c.text}}</button></sc-for></div></sc-if>
    <p style="margin: 0; font-size: 12px; color: #5B6967">Answered by qwen2.5:7b on this laptop. The chat does not leave your devices.</p>
    <div style="position: sticky; bottom: 0; display: flex; gap: 8px; align-items: center; background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 14px; padding: 8px">
      <input aria-label="Ask about this suggestion" placeholder="Ask about this suggestion" value="{{draft}}" onChange="{{onDraft}}" onKeyDown="{{onKey}}" style="flex-grow: 1; min-width: 0; border: 1px solid #D9E0DE; background: #F2F5F4; border-radius: 22px; padding: 10px 14px; font: inherit; font-size: 16px; color: #15201F">
      <button type="button" onClick="{{send}}" style="border: 0; border-radius: 9px; padding: 10px 14px; font: inherit; font-weight: 600; background: #0B6E73; color: #FFFFFF">Send</button>
    </div>
  </main>
  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #D9E0DE; padding: 4px 2px 20px"><a href="Home.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #0B6E73; font-weight: 600"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Home</a><a href="Records.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>Records</a><a href="Inbox.html" aria-label="Inbox, 4 items" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h5l1.5 3h5l1.5-3h5M5.5 5h13L21 13v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/></svg><span aria-hidden="true" style="position: absolute; top: -4px; left: 14px; min-width: 17px; height: 17px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #9A6212; color: #FFFFFF; font-size: 10px; font-weight: 700; line-height: 17px; text-align: center">4</span></span>Inbox</a><a href="Main.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg></span>Ask</a><a href="More.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span>More</a></nav>
</div></template>
<script type="text/plain" id="ll-logic" data-props='{}'>
class Component extends DCLogic {
  state = { msgs: [], draft: '', done: '' };
  ask(text) {
    const R = {"Make it a rule": "Tap \"Groceries\" above and the app saves the rule: every Sri Dunmore Stores record goes to Groceries, now and in new imports.", "Which other shops look the same?": "Juniper and Bigbasket have the same pattern: many small payments each month, all in Groceries.", "How much did I spend there?": "₹6,120 in 15 records from Jul to Sep, about ₹2,047 a month."};
    const reply = R[text] || 'In the app the local model answers this from the numbers of this suggestion. This prototype keeps its answers short.';
    this.setState({ msgs: [...this.state.msgs, { me: true, text }, { me: false, text: reply }], draft: '' });
  }
  renderVals() {
    const s = this.state, used = s.msgs.filter(m => m.me).map(m => m.text);
    const thread = [{ me: false, text: "I suggest Groceries. Sri Dunmore Stores has 15 records from 3 Jul to 28 Sep, ₹6,120 in total. The amounts are small and regular, like your other grocery shops.", ev: true }, ...s.msgs].map(m => ({ text: m.text, me: !!m.me, ai: !m.me, ev: !!m.ev }));
    const chips = ["Make it a rule", "Which other shops look the same?", "How much did I spend there?"].filter(t => !used.includes(t)).map(t => ({ text: t, ask: () => this.ask(t) }));
    return { thread, evidence: [{"id": 75, "name": "Sri Dunmore Stores", "date": "Mon, 28 Sep 2026", "amt": "₹637"}, {"id": 78, "name": "Sri Dunmore Stores", "date": "Fri, 18 Sep 2026", "amt": "₹627"}, {"id": 76, "name": "Sri Dunmore Stores", "date": "Fri, 18 Sep 2026", "amt": "₹157"}].map((r, i) => ({ ...r, border: i ? '1px solid #D9E0DE' : '0' })), chips, hasChips: chips.length > 0,
      draft: s.draft, onDraft: ev => this.setState({ draft: ev.target.value }),
      onKey: ev => { if (ev.key === 'Enter' && s.draft.trim()) this.ask(s.draft.trim()); },
      send: () => { if (s.draft.trim()) this.ask(s.draft.trim()); },
      done: s.done, notDone: !s.done, accept: () => this.setState({ done: "15 records of Sri Dunmore Stores are now in Groceries." }) };
  }
}
</script>
<div id="ll-root"></div>
<script src="../assets/ll-runtime.js"></script>
</div>
</body>
</html>
