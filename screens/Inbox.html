<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox · Ledgerlight prototype</title>
<style>
body{margin:0}
a{color:#0B6E73}a:hover{color:#08575B}
</style>
<style>
html{background:#E4EAE8}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0 32px;box-sizing:border-box;
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
.ll-bar{width:390px;max-width:100%;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#3F4B49}
.ll-bar a{color:#0B6E73;text-decoration:none;font-weight:600}
.ll-phone{border-radius:28px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 40px rgba(16,40,38,.18);background:#F2F5F4}
@media (max-width:420px){body{padding:0}.ll-bar{padding:10px 12px;box-sizing:border-box}.ll-phone{border-radius:0;box-shadow:none}}
html.thumb,html.thumb body{background:#F2F5F4;padding:0;display:block;min-height:0}
html.thumb .ll-bar{display:none}
/* Rows inside the scrolling main must keep their height (chip rows use overflow-x). */
.ll-phone main > *{flex-shrink:0}
html.thumb .ll-phone{border-radius:0;box-shadow:none}
</style>
<script>if(location.hash==='#thumb')document.documentElement.classList.add('thumb')</script>
</head>
<body>
<div class="ll-bar"><a href="../index.html">← All screens</a><span>Inbox</span></div>
<div class="ll-phone">
<template id="ll-tpl"><div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F5F4; color: #15201F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #D9E0DE; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; border-radius: 6px; background: #0B6E73; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">₹</span>
      
      <h1 style="margin: 0; flex-grow: 1; min-width: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Inbox</h1>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px"><div role="group" aria-label="Show" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; background: #E8EDEB; border-radius: 9px; padding: 3px">
      <sc-for list="{{tabs}}" as="s" hint-placeholder-count="4"><button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="border: 0; border-radius: 7px; padding: 7px 2px; font: inherit; font-size: 13px; font-weight: 500; color: #15201F; background: {{s.bg}}; box-shadow: {{s.shadow}}">{{s.label}}</button></sc-for></div></div>
  </header>
  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <sc-if value="{{msg}}" hint-placeholder-val="{{ false }}"><div role="status" style="font-size: 13px; padding: 10px 12px; border-radius: 8px; background: #15201F; color: #F2F5F4">{{msg}}</div></sc-if>
    <sc-if value="{{showCats}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 15px">Categorize · {{nCats}} merchants</h2></div>
      <div style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; overflow: hidden">
        <sc-for list="{{catRows}}" as="g" hint-placeholder-count="2"><div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: {{g.border}}">
          <span style="flex-grow: 1; min-width: 0"><span style="display: block; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px">{{g.entity}}</span><span style="font-size: 12px; color: #5B6967">{{g.meta}}</span></span>
          <button type="button" onClick="{{g.open}}" style="border: 0; border-radius: 9px; padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 600; background: #0B6E73; color: #FFFFFF; white-space: nowrap">Pick category</button></div></sc-for>
      </div>
    </sc-if>
    <sc-if value="{{showLinks}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 15px">Match refunds · {{nRef}}</h2><a href="Links.html" style="display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 9px; padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 600; background: #E8EDEB; color: #15201F; text-decoration: none; white-space: nowrap">Open Links ›</a></div>
      <sc-for list="{{refunds}}" as="x" hint-placeholder-count="2"><section style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; justify-content: space-between; gap: 8px"><span style="min-width: 0"><b>{{x.name}}</b><br><span style="font-size: 12px; color: #5B6967">{{x.meta}}</span></span><b style="font-variant-numeric: tabular-nums; color: #24794A">{{x.amt}}</b></div>
          <sc-if value="{{x.best}}" hint-placeholder-val="{{ true }}"><div style="background: #E8EDEB; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; font-size: 13px">
            <span style="font-size: 12px; color: #5B6967">{{x.bestMeta}}</span><span style="display: flex; justify-content: space-between; gap: 8px"><span>{{x.bestName}}</span><span style="font-variant-numeric: tabular-nums">{{x.bestAmt}}</span></span></div></sc-if>
          <div style="display: flex; gap: 6px">
            <button type="button" onClick="{{x.doLink}}" style="flex-grow: 1; border: 0; border-radius: 9px; padding: 9px 10px; font: inherit; font-size: 13px; font-weight: 600; background: #0B6E73; color: #FFFFFF; white-space: nowrap">{{x.link}}</button>
            <a href="Match.html" style="border-radius: 9px; padding: 9px 10px; font-size: 13px; font-weight: 600; background: #E8EDEB; color: #15201F; text-decoration: none; white-space: nowrap">Other…</a>
            <button type="button" onClick="{{x.notRef}}" style="border: 0; border-radius: 9px; padding: 9px 10px; font: inherit; font-size: 13px; font-weight: 600; background: #E8EDEB; color: #5B6967; white-space: nowrap">Not a refund</button>
          </div></section></sc-for>
    </sc-if>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><div style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 32px 16px; text-align: center; color: #5B6967"><h2 style="margin: 0 0 6px; font-size: 17px; color: #15201F">All clear</h2>Nothing needs you here.</div></sc-if>
    <sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; z-index: 5">
      <div role="dialog" aria-label="Pick a category" style="width: 100%; background: #FFFFFF; border-radius: 16px 16px 0 0; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 10px">
        <span aria-hidden="true" style="width: 40px; height: 4px; border-radius: 2px; background: #D9E0DE; align-self: center"></span>
        <h2 style="margin: 0; font-size: 18px; font-family: ui-monospace, 'SF Mono', Menlo, monospace">{{sheetName}}</h2>
        <p style="margin: 0; font-size: 13px; color: #5B6967">{{sheetMeta}}</p>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{catBtns}}" as="c" hint-placeholder-count="6"><button type="button" onClick="{{c.pick}}" style="display: flex; align-items: center; gap: 8px; border: 1px {{c.bstyle}} {{c.bcolor}}; background: #FFFFFF; border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px; text-align: left; color: #15201F"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{c.color}}"></span>{{c.name}}</button></sc-for>
        </div>
        <button type="button" onClick="{{closeSheet}}" style="align-self: flex-start; border: 0; border-radius: 9px; padding: 11px 16px; font: inherit; font-weight: 600; background: #E8EDEB; color: #15201F">Cancel</button>
      </div></div></sc-if>
  </main>
  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #D9E0DE; padding: 4px 2px 20px"><a href="Home.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Home</a><a href="Records.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>Records</a><a href="Inbox.html" aria-current="page" aria-label="Inbox, 4 items" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #0B6E73; font-weight: 600"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h5l1.5 3h5l1.5-3h5M5.5 5h13L21 13v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/></svg><span aria-hidden="true" style="position: absolute; top: -4px; left: 14px; min-width: 17px; height: 17px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #9A6212; color: #FFFFFF; font-size: 10px; font-weight: 700; line-height: 17px; text-align: center">4</span></span>Inbox</a><a href="Main.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg></span>Ask</a><a href="More.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span>More</a></nav>
</div></template>
<script type="text/plain" id="ll-logic" data-props='{}'>
class Component extends DCLogic {
  state = { f: 'all', gone: [], done: [], sheet: null, msg: '' };
  seg(list, cur, key) {
    return list.map(([k, l]) => ({ label: l, on: String(k === cur), bg: k === cur ? '#FFFFFF' : 'transparent',
      shadow: k === cur ? '0 1px 2px rgba(0,0,0,.12)' : 'none', pick: () => this.setState({ [key]: k }) }));
  }
  cards(list) {
    const gone = this.state.gone;
    return list.filter(x => !gone.includes(x.id)).map(x => ({ ...x,
      doLink: () => this.setState({ gone: [...gone, x.id], msg: x.doneMsg }),
      notRef: () => this.setState({ gone: [...gone, x.id], msg: 'Marked as not a refund.' }) }));
  }
  renderVals() {
    const s = this.state, CATS = [{"id": "food", "name": "Food & Dining", "color": "#E07A3F"}, {"id": "groceries", "name": "Groceries", "color": "#3E9E5E"}, {"id": "transport", "name": "Transport", "color": "#3478C6"}, {"id": "shopping", "name": "Shopping", "color": "#C24D86"}, {"id": "entertainment", "name": "Entertainment", "color": "#8462CC"}, {"id": "bills", "name": "Bills & Utilities", "color": "#B88B10"}, {"id": "health", "name": "Health", "color": "#D64545"}, {"id": "travel", "name": "Travel", "color": "#1F9696"}, {"id": "subscriptions", "name": "Subscriptions", "color": "#7D8794"}, {"id": "rent", "name": "Rent & Housing", "color": "#9A6440"}, {"id": "education", "name": "Education", "color": "#2F7D6D"}, {"id": "insurance", "name": "Insurance", "color": "#5E6EB8"}, {"id": "fees", "name": "Fees & Charges", "color": "#A0522D"}, {"id": "cash", "name": "Cash Withdrawal", "color": "#6B7B3A"}, {"id": "loan", "name": "Loan & EMI", "color": "#B5446E"}, {"id": "people", "name": "People (UPI to persons)", "color": "#8C8C3A"}, {"id": "other", "name": "Other", "color": "#98A3A1"}], ROWS = [{"id": 0, "entity": "Sri Dunmore Stores", "meta": "15 records · ₹6,120 · maybe Groceries", "sug": "groceries"}, {"id": 1, "entity": "Blue Tokai Coffee", "meta": "12 records · ₹4,700 · maybe Food & Dining", "sug": "food"}];
    const rows = ROWS.filter(g => !s.done.includes(g.id)).map((g, i) => ({ ...g, border: i ? '1px solid #D9E0DE' : '0', open: () => this.setState({ sheet: g.id }) }));
    const refunds = this.cards([{"id": 142, "name": "Brightway Refund", "meta": "Credit · Sat, 12 Sep 2026 · Test Bank Platinum", "amt": "+₹1,299", "best": true, "bestMeta": "Best match · same shop · 5 days before", "bestName": "Brightway Corvel · 7 Sep · Test Bank Platinum", "bestAmt": "₹4,600", "link": "Link ₹1,299", "doneMsg": "Linked ₹1,299 as refund."}, {"id": 233, "name": "Quenby Designs Refund", "meta": "Credit · Mon, 24 Aug 2026 · Other Bank Credit Card", "amt": "+₹1,700", "best": true, "bestMeta": "Best match · same shop · 5 days before", "bestName": "Quenby Designs · 19 Aug · Other Bank Credit Card", "bestAmt": "₹3,319", "link": "Link ₹1,700", "doneMsg": "Linked ₹1,700 as refund."}]);
    const g = ROWS.find(x => x.id === s.sheet);
    const catBtns = CATS.map(c => ({ ...c, bstyle: g && g.sug === c.id ? 'dashed' : 'solid', bcolor: g && g.sug === c.id ? '#0B6E73' : '#D9E0DE',
      pick: () => this.setState({ done: [...s.done, s.sheet], sheet: null, msg: g.entity + ' → ' + c.name + '. Rule saved.' }) }));
    const tabs = this.seg([['all', 'All ' + (rows.length + refunds.length)], ['cats', 'Categories ' + rows.length], ['links', 'Links ' + refunds.length], ['checks', 'Checks 0']], s.f, 'f');
    const showCats = (s.f === 'all' || s.f === 'cats') && rows.length > 0, showLinks = (s.f === 'all' || s.f === 'links') && refunds.length > 0;
    return { tabs, catRows: rows, nCats: rows.length, refunds, nRef: refunds.length, showCats, showLinks, empty: !showCats && !showLinks, msg: s.msg,
      sheet: !!g, sheetName: g ? g.entity : '', sheetMeta: g ? g.meta : '', catBtns, closeSheet: () => this.setState({ sheet: null }) };
  }
}
</script>
<div id="ll-root"></div>
<script src="../assets/ll-runtime.js"></script>
</div>
</body>
</html>
