<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Ledgerlight prototype</title>
<style>
body{margin:0}
a{color:#0B6E73}a:hover{color:#08575B}
</style>
<style>
html{background:#E4EAE8}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0 32px;box-sizing:border-box;
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
.ll-bar{width:390px;max-width:100%;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#3F4B49}
.ll-bar a{color:#0B6E73;text-decoration:none;font-weight:600}
.ll-phone{border-radius:28px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 40px rgba(16,40,38,.18);background:#F2F5F4}
@media (max-width:420px){body{padding:0}.ll-bar{padding:10px 12px;box-sizing:border-box}.ll-phone{border-radius:0;box-shadow:none}}
html.thumb,html.thumb body{background:#F2F5F4;padding:0;display:block;min-height:0}
html.thumb .ll-bar{display:none}
/* Rows inside the scrolling main must keep their height (chip rows use overflow-x). */
.ll-phone main > *{flex-shrink:0}
html.thumb .ll-phone{border-radius:0;box-shadow:none}
</style>
<script>if(location.hash==='#thumb')document.documentElement.classList.add('thumb')</script>
</head>
<body>
<div class="ll-bar"><a href="../index.html">← All screens</a><span>Settings</span></div>
<div class="ll-phone">
<template id="ll-tpl"><div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F5F4; color: #15201F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #D9E0DE; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; border-radius: 6px; background: #0B6E73; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">₹</span>
      <a href="More.html" aria-label="Back" style="flex: none; width: 36px; height: 40px; margin-left: -6px; display: flex; align-items: center; justify-content: center; color: #15201F; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
      <h1 style="margin: 0; flex-grow: 1; min-width: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Settings</h1>
    </div>
    
  </header>
  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <sc-if value="{{msg}}" hint-placeholder-val="{{ false }}"><div role="status" style="font-size: 13px; padding: 10px 12px; border-radius: 8px; background: #15201F; color: #F2F5F4">{{msg}}</div></sc-if>
    <section style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0"><div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700">Dashboard</h2><span style="font-size: 12px; color: #5B6967; text-align: right">Changes apply at once</span></div><div><sc-for list="{{dash}}" as="w" hint-placeholder-count="1"><div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: {{w.border}}"><span>{{w.label}}<br><span style="font-size: 12px; color: #5B6967">{{w.sub}}</span></span><button type="button" role="switch" aria-checked="{{w.on}}" aria-label="{{w.label}}" onClick="{{w.flip}}" style="flex: none; width: 46px; height: 28px; border-radius: 14px; border: 0; padding: 0; position: relative; background: {{w.bg}}"><span style="position: absolute; top: 3px; left: {{w.left}}; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.25)"></span></button></div></sc-for>
      <span style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #5B6967; font-weight: 600">Accounts on the dashboard</span><sc-for list="{{accts}}" as="w" hint-placeholder-count="4"><div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: {{w.border}}"><span>{{w.label}}<br><span style="font-size: 12px; color: #5B6967">{{w.sub}}</span></span><button type="button" role="switch" aria-checked="{{w.on}}" aria-label="{{w.label}}" onClick="{{w.flip}}" style="flex: none; width: 46px; height: 28px; border-radius: 14px; border: 0; padding: 0; position: relative; background: {{w.bg}}"><span style="position: absolute; top: 3px; left: {{w.left}}; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.25)"></span></button></div></sc-for></div></section>
    <section style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0"><div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 16px">Local model</h2><span style="font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: .03em; background: #E0EFE6; color: #24794A">RUNNING</span></div>
      <sc-for list="{{llm}}" as="w" hint-placeholder-count="1"><div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: {{w.border}}"><span>{{w.label}}<br><span style="font-size: 12px; color: #5B6967">{{w.sub}}</span></span><button type="button" role="switch" aria-checked="{{w.on}}" aria-label="{{w.label}}" onClick="{{w.flip}}" style="flex: none; width: 46px; height: 28px; border-radius: 14px; border: 0; padding: 0; position: relative; background: {{w.bg}}"><span style="position: absolute; top: 3px; left: {{w.left}}; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.25)"></span></button></div></sc-for>
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid #D9E0DE"><span>Model</span><select style="border: 1px solid #D9E0DE; background: #FFFFFF; border-radius: 99px; padding: 6px 10px; font: inherit; font-size: 13px"><option>qwen2.5:7b</option><option selected>qwen2.5-coder:7b</option></select></div>
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid #D9E0DE"><span>Apply automatically at</span><select style="border: 1px solid #D9E0DE; background: #FFFFFF; border-radius: 99px; padding: 6px 10px; font: inherit; font-size: 13px"><option>confidence 0.7 or more</option><option>confidence 0.8 or more</option><option selected>confidence 0.9 or more</option><option>confidence 0.95 or more</option><option>Never (suggest only)</option></select></div>
      <p style="margin: 0; font-size: 13px; color: #5B6967">2 merchants waiting · 2 answered. Records set by the model show LLM. Check them with Records → By model.</p>
      <button type="button" onClick="{{askNow}}" style="align-self: flex-start; border: 0; border-radius: 9px; padding: 11px 16px; font: inherit; font-weight: 600; background: #0B6E73; color: #FFFFFF">Ask the model now</button></section>
    <section style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0"><div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700">Backups</h2><span style="font-size: 12px; color: #5B6967; text-align: right">0 backups kept</span></div><p style="margin: 0; font-size: 14px">No backup yet.</p><p style="margin: 0; font-size: 13px; color: #5B6967">One backup is made each day before the first import. The last 30 are kept in data/backups/.</p>
      <button type="button" onClick="{{backup}}" style="align-self: flex-start; border: 0; border-radius: 9px; padding: 11px 16px; font: inherit; font-weight: 600; background: #E8EDEB; color: #15201F">Back up now</button></section>
    <section style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0"><div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700">PDF passwords</h2><span style="font-size: 12px; color: #5B6967; text-align: right">0 passwords saved</span></div><p style="margin: 0; font-size: 13px; color: #5B6967">Every import tries these on locked PDFs. Saved on this computer in data/secrets/. This page never shows a saved password.</p>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; min-width: 0">Label<input placeholder="e.g. testbank-savings" value="{{pwLabel}}" onChange="{{onPwLabel}}" autocomplete="off" style="border: 1px solid #D9E0DE; background: #F2F5F4; border-radius: 8px; padding: 9px 10px; font: inherit; font-size: 16px; width: 100%; box-sizing: border-box; color: #15201F"></label><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; min-width: 0">Password<input type="password" value="{{pw}}" onChange="{{onPw}}" autocomplete="new-password" style="border: 1px solid #D9E0DE; background: #F2F5F4; border-radius: 8px; padding: 9px 10px; font: inherit; font-size: 16px; width: 100%; box-sizing: border-box; color: #15201F"></label></div>
      <button type="button" onClick="{{savePw}}" style="border: 0; border-radius: 9px; padding: 11px 16px; font: inherit; font-weight: 600; background: #0B6E73; color: #FFFFFF">Save password</button></section>
    <section style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0"><div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 16px">Notifications</h2><span style="font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: .03em; background: #FBEFD9; color: #9A6212">PHASE 4</span></div>
      <p style="margin: 0; font-size: 14px; color: #5B6967">Telegram and Slack daily summaries come in Phase 4. You will choose the channel, the detail level and the time here.</p></section>
    <section style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0"><div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700">Audit log</h2><a href="AuditLog.html" style="display: inline-flex; align-items: center; border: 0; border-radius: 9px; padding: 7px 12px; font-size: 13px; font-weight: 600; background: #E8EDEB; color: #15201F; text-decoration: none; white-space: nowrap">Open</a></div>
      <p style="margin: 0; font-size: 13px; color: #5B6967">Every change you made in the app: uploaded files, tags added or deleted, links, rules, categories and settings. Kept on this computer. Passwords are never logged.</p></section>
    <section style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0"><div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700">Open on iPhone</h2></div><p style="margin: 0">Open the app address in Safari → <b>Share</b> → <b>Add to Home Screen</b>.</p>
      <p style="margin: -4px 0 0; font-size: 13px; color: #5B6967">Install as an app needs HTTPS (Tailscale serve). Over plain Wi-Fi the site works in Safari.</p></section>
    <section style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0"><div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700">Your rules</h2><span style="font-size: 12px; color: #5B6967; text-align: right">0 rules · they win over starter rules</span></div><p style="margin: 0; font-size: 14px; color: #5B6967">No rules yet. Answers on the Review page create rules.</p></section>
    <section style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0"><div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700">Add a rule</h2></div><div style="display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px">
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; min-width: 0">Look in<select style="border: 1px solid #D9E0DE; background: #F2F5F4; border-radius: 8px; padding: 9px 10px; font: inherit; font-size: 16px; width: 100%; box-sizing: border-box; color: #15201F"><option>Statement text</option><option>Merchant name</option></select></label><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; min-width: 0">Match<select style="border: 1px solid #D9E0DE; background: #F2F5F4; border-radius: 8px; padding: 9px 10px; font: inherit; font-size: 16px; width: 100%; box-sizing: border-box; color: #15201F"><option>Contains</option><option>Whole word</option><option>Is exactly</option><option>Regular expression</option></select></label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; min-width: 0">Text<input placeholder="e.g. BLUE TOKAI" value="{{rule}}" onChange="{{onRule}}" style="border: 1px solid #D9E0DE; background: #F2F5F4; border-radius: 8px; padding: 9px 10px; font: inherit; font-size: 16px; width: 100%; box-sizing: border-box; color: #15201F"></label><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; min-width: 0">Direction<select style="border: 1px solid #D9E0DE; background: #F2F5F4; border-radius: 8px; padding: 9px 10px; font: inherit; font-size: 16px; width: 100%; box-sizing: border-box; color: #15201F"><option>Debits and credits</option><option>Debits only</option><option>Credits only</option></select></label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; min-width: 0">Category<select style="border: 1px solid #D9E0DE; background: #F2F5F4; border-radius: 8px; padding: 9px 10px; font: inherit; font-size: 16px; width: 100%; box-sizing: border-box; color: #15201F"><option>No change</option><option>Food &amp; Dining</option><option>Groceries</option><option>Transport</option><option>Shopping</option><option>Entertainment</option><option>Bills &amp; Utilities</option><option>Health</option><option>Travel</option><option>Subscriptions</option><option>Rent &amp; Housing</option><option>Education</option><option>Insurance</option><option>Fees &amp; Charges</option><option>Cash Withdrawal</option><option>Loan &amp; EMI</option><option>People (UPI to persons)</option><option>Other</option><option>Investments</option><option>Income</option><option>Refunds</option><option>Own transfers</option></select></label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; min-width: 0">Tags (separated by commas)<input placeholder="comma separated" autocapitalize="none" style="border: 1px solid #D9E0DE; background: #F2F5F4; border-radius: 8px; padding: 9px 10px; font: inherit; font-size: 16px; width: 100%; box-sizing: border-box; color: #15201F"></label></div>
      <div style="display: flex; gap: 8px"><button type="button" onClick="{{testRule}}" style="border: 0; border-radius: 9px; padding: 11px 16px; font: inherit; font-weight: 600; background: #E8EDEB; color: #15201F">Test</button>
        <button type="button" onClick="{{saveRule}}" style="border: 0; border-radius: 9px; padding: 11px 16px; font: inherit; font-weight: 600; background: #0B6E73; color: #FFFFFF">Save rule</button></div></section>
  </main>
  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #D9E0DE; padding: 4px 2px 20px"><a href="Home.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Home</a><a href="Records.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>Records</a><a href="Inbox.html" aria-label="Inbox, 4 items" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h5l1.5 3h5l1.5-3h5M5.5 5h13L21 13v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/></svg><span aria-hidden="true" style="position: absolute; top: -4px; left: 14px; min-width: 17px; height: 17px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #9A6212; color: #FFFFFF; font-size: 10px; font-weight: 700; line-height: 17px; text-align: center">4</span></span>Inbox</a><a href="Main.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg></span>Ask</a><a href="More.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #0B6E73; font-weight: 600"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span>More</a></nav>
</div></template>
<script type="text/plain" id="ll-logic" data-props='{}'>
class Component extends DCLogic {
  state = { on: {}, msg: '', pwLabel: '', pw: '', rule: '' };
  sw(list) {
    return list.map((w, i) => { const on = this.state.on[w.key] ?? w.on;
      return { ...w, on: String(on), bg: on ? '#0B6E73' : '#D9E0DE', left: on ? '21px' : '3px', border: i ? '1px solid #D9E0DE' : '0',
        flip: () => this.setState({ on: { ...this.state.on, [w.key]: !on }, msg: w.label + (on ? ' off.' : ' on.') }) }; });
  }
  renderVals() {
    const s = this.state, SW = [{"key": "stats", "label": "Show card and account stats", "sub": "The “By account” panel on Overview", "on": true}, {"key": "testbank-platinum", "label": "Test Bank Platinum", "sub": "Credit card", "on": true}, {"key": "testbank-rewards", "label": "Test Bank Rewards", "sub": "Credit card", "on": true}, {"key": "otherbank-cc", "label": "Other Bank Credit Card", "sub": "Credit card", "on": true}, {"key": "testbank-savings", "label": "Test Bank Savings", "sub": "Savings account", "on": true}];
    return { dash: this.sw(SW.slice(0, 1)), accts: this.sw(SW.slice(1)), llm: this.sw([{ key: 'llm', label: 'Ask about unknown merchants', sub: 'Ollama on this computer only. Nothing leaves your devices.', on: true }]),
      msg: s.msg, askNow: () => this.setState({ msg: 'Model answered 2 merchants.' }), backup: () => this.setState({ msg: 'Backup saved.' }),
      pwLabel: s.pwLabel, pw: s.pw, onPwLabel: ev => this.setState({ pwLabel: ev.target.value }), onPw: ev => this.setState({ pw: ev.target.value }),
      savePw: () => this.setState(s.pwLabel && s.pw ? { pw: '', msg: 'Password saved. The next import of a locked PDF tries it.' } : { msg: 'Type a label and a password.' }),
      rule: s.rule, onRule: ev => this.setState({ rule: ev.target.value }),
      testRule: () => this.setState({ msg: s.rule ? 'In the app: the number of records that match, with a sample.' : 'Type the text to match first.' }),
      saveRule: () => this.setState({ msg: s.rule ? 'Rule saved. Records updated.' : 'Type the text to match first.' }) };
  }
}
</script>
<div id="ll-root"></div>
<script src="../assets/ll-runtime.js"></script>
</div>
</body>
</html>
