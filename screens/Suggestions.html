<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suggested for you · Ledgerlight prototype</title>
<style>
body{margin:0}
a{color:#0B6E73}a:hover{color:#08575B}
</style>
<style>
html{background:#E4EAE8}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0 32px;box-sizing:border-box;
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
.ll-bar{width:390px;max-width:100%;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#3F4B49}
.ll-bar a{color:#0B6E73;text-decoration:none;font-weight:600}
.ll-phone{border-radius:28px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 40px rgba(16,40,38,.18);background:#F2F5F4}
@media (max-width:420px){body{padding:0}.ll-bar{padding:10px 12px;box-sizing:border-box}.ll-phone{border-radius:0;box-shadow:none}}
html.thumb,html.thumb body{background:#F2F5F4;padding:0;display:block;min-height:0}
html.thumb .ll-bar{display:none}
/* Rows inside the scrolling main must keep their height (chip rows use overflow-x). */
.ll-phone main > *{flex-shrink:0}
html.thumb .ll-phone{border-radius:0;box-shadow:none}
</style>
<script>if(location.hash==='#thumb')document.documentElement.classList.add('thumb')</script>
</head>
<body>
<div class="ll-bar"><a href="../index.html">← All screens</a><span>Suggested for you</span></div>
<div class="ll-phone">
<template id="ll-tpl"><div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F5F4; color: #15201F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #D9E0DE; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; border-radius: 6px; background: #0B6E73; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">₹</span>
      <a href="Home.html" aria-label="Back" style="flex: none; width: 36px; height: 40px; margin-left: -6px; display: flex; align-items: center; justify-content: center; color: #15201F; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
      <h1 style="margin: 0; flex-grow: 1; min-width: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Suggested for you</h1>
    </div>
    
  </header>
  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <p style="margin: 0 2px; font-size: 13px; color: #5B6967">From the local AI on this laptop. Tap an item to ask about it.</p>
    <sc-if value="{{msg}}" hint-placeholder-val="{{ false }}"><div role="status" style="font-size: 13px; padding: 10px 12px; border-radius: 8px; background: #15201F; color: #F2F5F4">{{msg}}</div></sc-if>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <section style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; overflow: hidden">
        <h2 style="margin: 0; font-size: inherit"><button type="button" onClick="{{g.toggle}}" aria-expanded="{{g.expanded}}" style="width: 100%; border: 0; background: none; display: flex; align-items: center; gap: 8px; padding: 12px 14px; font: inherit; text-align: left; color: #15201F">
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="display: flex; align-items: center; gap: 8px"><span style="font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 17px; font-weight: 700">{{g.name}}</span>
            <span style="font-size: 12px; font-weight: 700; min-width: 22px; padding: 1px 7px; border-radius: 99px; text-align: center; background: {{g.cBg}}; color: {{g.cFg}}">{{g.count}}</span></span>
            <sc-if value="{{g.closed}}" hint-placeholder-val="{{ true }}"><span style="font-size: 12px; color: #5B6967; font-weight: 400">{{g.hint}}</span></sc-if></span>
          <span aria-hidden="true" style="color: #5B6967; font-size: 14px">{{g.chev}}</span></button></h2>
        <sc-if value="{{g.open}}" hint-placeholder-val="{{ false }}">
          <sc-if value="{{g.isQ}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid #D9E0DE">
            <sc-for list="{{g.rows}}" as="x" hint-placeholder-count="3"><a href="SuggestionChat.html" style="border: 1px solid #D9E0DE; background: #FFFFFF; border-radius: 99px; padding: 6px 13px; font-size: 13px; text-decoration: none; color: #15201F">{{x.title}}</a></sc-for></div></sc-if>
          <sc-if value="{{g.isList}}" hint-placeholder-val="{{ true }}"><div style="border-top: 1px solid #D9E0DE">
            <sc-for list="{{g.rows}}" as="x" hint-placeholder-count="3"><div style="display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 16px; border-top: {{x.border}}; min-height: 52px">
          <a href="SuggestionChat.html" style="flex-grow: 1; min-width: 0; padding: 6px 0; display: flex; flex-direction: column; gap: 1px; text-decoration: none; color: #15201F">
            <span style="font-size: 15px; font-weight: 500">{{x.title}}</span>
            <sc-if value="{{x.sub}}" hint-placeholder-val="{{ true }}"><span style="font-size: 12px; color: #5B6967; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{x.sub}}</span></sc-if>
          </a>
          <sc-if value="{{x.label}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{x.go}}" aria-label="{{x.aria}}" style="flex: none; max-width: 42%; border: 1px solid #0B6E73; background: #DCEDED; color: #0B6E73; border-radius: 99px; padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{x.label}}</button></sc-if>
          <sc-if value="{{x.chev}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; color: #5B6967; font-size: 20px; padding: 0 6px">›</span></sc-if>
          <button type="button" onClick="{{x.dismiss}}" aria-label="Dismiss" style="flex: none; width: 36px; height: 36px; border: 0; background: none; border-radius: 50%; color: #5B6967; font-size: 20px; line-height: 1">×</button>
        </div></sc-for>
            <sc-if value="{{g.more}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{g.showMore}}" style="width: 100%; border: 0; border-top: 1px solid #D9E0DE; background: none; padding: 11px; font: inherit; font-size: 13px; font-weight: 600; color: #0B6E73">{{g.more}}</button></sc-if>
          </div></sc-if>
        </sc-if>
      </section>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><div style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 32px 16px; text-align: center; color: #5B6967">Nothing to suggest now. New suggestions come after each import.</div></sc-if>
  </main>
  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #D9E0DE; padding: 4px 2px 20px"><a href="Home.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #0B6E73; font-weight: 600"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Home</a><a href="Records.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>Records</a><a href="Inbox.html" aria-label="Inbox, 4 items" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h5l1.5 3h5l1.5-3h5M5.5 5h13L21 13v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/></svg><span aria-hidden="true" style="position: absolute; top: -4px; left: 14px; min-width: 17px; height: 17px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #9A6212; color: #FFFFFF; font-size: 10px; font-weight: 700; line-height: 17px; text-align: center">4</span></span>Inbox</a><a href="Main.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg></span>Ask</a><a href="More.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span>More</a></nav>
</div></template>
<script type="text/plain" id="ll-logic" data-props='{}'>
class Component extends DCLogic {
  state = { gone: [], msg: '', open: { insight: true }, more: {} };
  rowsFor(list) {
    const gone = this.state.gone;
    return list.filter(x => !gone.includes(x.id)).map((x, i) => ({ ...x, border: i ? '1px solid #D9E0DE' : '0', chev: !x.label,
      aria: x.label ? (x.group === 'category' ? 'Put ' + x.title + ' in ' + x.label : x.label + ': ' + x.title) : '',
      go: () => this.setState({ gone: [...gone, x.id], msg: x.done }),
      dismiss: () => this.setState({ gone: [...gone, x.id], msg: 'Dismissed. It does not come back.' }) }));
  }
  renderVals() {
    const s = this.state, ALL = [{"id": "tjkpttwbuwedsjqqrdtd", "group": "insight", "title": "Spotify Solace now costs ₹179 a month, not ₹119", "sub": "", "label": "", "done": ""}, {"id": "unecncsmsxrkrnucwtkx", "group": "category", "title": "Sri Dunmore Stores", "sub": "15 records, ₹6,120", "label": "Groceries", "done": "15 records of Sri Dunmore Stores are now in Groceries."}, {"id": "fsstqntdfvfjgjxepyer", "group": "category", "title": "Blue Tokai Coffee", "sub": "12 records, ₹4,700", "label": "Food & Dining", "done": "12 records of Blue Tokai Coffee are now in Food & Dining."}, {"id": "banhwpmfpzgntntahqvm", "group": "tag", "title": "Trip, 8 Jul – 9 Jul", "sub": "9 records, ₹19,124", "label": "Tag", "done": "#trip-jul-2026 added to 9 records."}, {"id": "juueabhxyukudzkxwgzd", "group": "tag", "title": "Trip, 8 Aug – 9 Aug", "sub": "6 records, ₹11,098", "label": "Tag", "done": "#trip-aug-2026 added to 6 records."}, {"id": "dztmgdgrafvwqajcvbmt", "group": "tag", "title": "Trip, 16 Sep – 17 Sep", "sub": "5 records, ₹14,430", "label": "Tag", "done": "#trip-sep-2026 added to 5 records."}, {"id": "ctnkzzwbpxtcqxbgnahh", "group": "question", "title": "How much did I spend on shopping last month?", "sub": "", "label": "", "done": ""}, {"id": "sqdneaacgrdbmbyhhkcb", "group": "question", "title": "Kestrel & Co Corvel in the last 3 months", "sub": "", "label": "", "done": ""}, {"id": "wgtaevakszpsbqkpnqyq", "group": "question", "title": "Uber Systems Corvel in the last 3 months", "sub": "", "label": "", "done": ""}, {"id": "wtetrgrbkrydhfqykavh", "group": "question", "title": "Refunds in the last 3 months", "sub": "", "label": "", "done": ""}], G = [["insight", "Insights", "Changes in your spending"], ["category", "Categorize", "Merchants with no category"], ["tag", "Trips", "Days that look like a trip"], ["rule", "Rules", "Categories you set by hand, again and again"], ["question", "Questions", "Ask the local AI"]];
    const groups = G.map(([key, name, hint]) => {
      const rows = this.rowsFor(ALL.filter(x => x.group === key)), open = !!s.open[key], shown = s.more[key] ? rows : rows.slice(0, 3);
      return { name, hint, count: rows.length, cBg: key === 'insight' ? '#EEEAF9' : '#E8EDEB', cFg: key === 'insight' ? '#5B4BA8' : '#5B6967',
        open, closed: !open, expanded: String(open), chev: open ? '▲' : '▼', isQ: key === 'question', isList: key !== 'question', rows: key === 'question' ? rows : shown,
        more: rows.length > shown.length && key !== 'question' ? 'Show ' + (rows.length - shown.length) + ' more' : '',
        toggle: () => this.setState({ open: { ...s.open, [key]: !open } }), showMore: () => this.setState({ more: { ...s.more, [key]: true } }) };
    }).filter(g => g.count > 0);
    return { groups, empty: !groups.length, msg: s.msg };
  }
}
</script>
<div id="ll-root"></div>
<script src="../assets/ll-runtime.js"></script>
</div>
</body>
</html>
