<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trips &amp; tags · Ledgerlight prototype</title>
<style>
body{margin:0}
a{color:#0B6E73}a:hover{color:#08575B}
</style>
<style>
html{background:#E4EAE8}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0 32px;box-sizing:border-box;
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
.ll-bar{width:390px;max-width:100%;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#3F4B49}
.ll-bar a{color:#0B6E73;text-decoration:none;font-weight:600}
.ll-phone{border-radius:28px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 40px rgba(16,40,38,.18);background:#F2F5F4}
@media (max-width:420px){body{padding:0}.ll-bar{padding:10px 12px;box-sizing:border-box}.ll-phone{border-radius:0;box-shadow:none}}
html.thumb,html.thumb body{background:#F2F5F4;padding:0;display:block;min-height:0}
html.thumb .ll-bar{display:none}
/* Rows inside the scrolling main must keep their height (chip rows use overflow-x). */
.ll-phone main > *{flex-shrink:0}
html.thumb .ll-phone{border-radius:0;box-shadow:none}
</style>
<script>if(location.hash==='#thumb')document.documentElement.classList.add('thumb')</script>
</head>
<body>
<div class="ll-bar"><a href="../index.html">← All screens</a><span>Trips &amp; tags</span></div>
<div class="ll-phone">
<template id="ll-tpl"><div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F5F4; color: #15201F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #D9E0DE; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; border-radius: 6px; background: #0B6E73; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">₹</span>
      <a href="Home.html" aria-label="Back" style="flex: none; width: 36px; height: 40px; margin-left: -6px; display: flex; align-items: center; justify-content: center; color: #15201F; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
      <h1 style="margin: 0; flex-grow: 1; min-width: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Trips &amp; tags</h1>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px"><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><label style="display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #5B6967; min-width: 0">Account<select style="width: 100%; box-sizing: border-box; border: 1px solid #0B6E73; background: #F2F5F4; border-radius: 10px; padding: 9px 10px; font: inherit; font-size: 15px; color: #15201F"><option>All accounts</option><option>Test Bank Platinum</option><option>Test Bank Savings</option><option>Test Bank Rewards</option><option>Other Bank Credit Card</option></select></label><label style="display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #5B6967; min-width: 0">Period<select style="width: 100%; box-sizing: border-box; border: 1px solid #0B6E73; background: #F2F5F4; border-radius: 10px; padding: 9px 10px; font: inherit; font-size: 15px; color: #15201F"><option selected>Recent months</option><option>Last 1 week</option><option>Last 1 month</option><option>Last 3 months</option><option>Last 1 year</option><option>All time</option><option>Custom range</option></select></label></div></div>
  </header>
  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <nav aria-label="Dashboards" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px"><a href="Home.html" style="flex: none; border: 1px solid #D9E0DE; background: #FFFFFF; color: #15201F; border-radius: 99px; padding: 6px 13px; font-size: 13px; white-space: nowrap; text-decoration: none">Overview</a><a href="Trends.html" style="flex: none; border: 1px solid #D9E0DE; background: #FFFFFF; color: #15201F; border-radius: 99px; padding: 6px 13px; font-size: 13px; white-space: nowrap; text-decoration: none">Trends</a><a href="CashFlow.html" style="flex: none; border: 1px solid #D9E0DE; background: #FFFFFF; color: #15201F; border-radius: 99px; padding: 6px 13px; font-size: 13px; white-space: nowrap; text-decoration: none">Cash flow</a><a href="Cards.html" style="flex: none; border: 1px solid #D9E0DE; background: #FFFFFF; color: #15201F; border-radius: 99px; padding: 6px 13px; font-size: 13px; white-space: nowrap; text-decoration: none">Cards</a><a href="Recurring.html" style="flex: none; border: 1px solid #D9E0DE; background: #FFFFFF; color: #15201F; border-radius: 99px; padding: 6px 13px; font-size: 13px; white-space: nowrap; text-decoration: none">Recurring</a><a href="Merchants.html" style="flex: none; border: 1px solid #D9E0DE; background: #FFFFFF; color: #15201F; border-radius: 99px; padding: 6px 13px; font-size: 13px; white-space: nowrap; text-decoration: none">Merchants</a><a href="RefundsDash.html" style="flex: none; border: 1px solid #D9E0DE; background: #FFFFFF; color: #15201F; border-radius: 99px; padding: 6px 13px; font-size: 13px; white-space: nowrap; text-decoration: none">Refunds</a><a href="Trips.html" aria-current="page" style="flex: none; border: 1px solid #15201F; background: #15201F; color: #F2F5F4; border-radius: 99px; padding: 6px 13px; font-size: 13px; white-space: nowrap; text-decoration: none">Trips &amp; tags</a></nav>
    <section style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0"><div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700">Tag a trip</h2><span style="font-size: 12px; color: #5B6967; text-align: right">All spend records between the two dates</span></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <label style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 4px; font-size: 13px">Tag<input placeholder="e.g. goa-trip" value="{{tag}}" onChange="{{onTag}}" style="border: 1px solid #D9E0DE; background: #F2F5F4; border-radius: 8px; padding: 9px 10px; font: inherit; font-size: 16px; width: 100%; box-sizing: border-box; color: #15201F"></label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px">From<input type="date" value="2026-09-16" style="border: 1px solid #D9E0DE; background: #F2F5F4; border-radius: 8px; padding: 9px 10px; font: inherit; font-size: 16px; width: 100%; box-sizing: border-box; color: #15201F"></label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px">To<input type="date" value="2026-09-17" style="border: 1px solid #D9E0DE; background: #F2F5F4; border-radius: 8px; padding: 9px 10px; font: inherit; font-size: 16px; width: 100%; box-sizing: border-box; color: #15201F"></label>
      </div>
      <div><button type="button" onClick="{{save}}" style="border: 0; border-radius: 9px; padding: 11px 16px; font: inherit; font-weight: 600; background: #0B6E73; color: #FFFFFF">Tag records</button></div>
      <sc-if value="{{msg}}" hint-placeholder-val="{{ false }}"><div role="status" style="font-size: 13px; padding: 10px 12px; border-radius: 8px; background: #15201F; color: #F2F5F4">{{msg}}</div></sc-if></section>
    <sc-if value="{{hasTags}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><div style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; color: #15201F"><span style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #5B6967; font-weight: 600">Tagged spend</span><span style="font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #15201F">₹23,580</span><span style="font-size: 12px; color: #5B6967">3 records, each counted once</span></div><div style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; color: #15201F"><span style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #5B6967; font-weight: 600">Counted twice in rows</span><span style="font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #15201F">₹0</span><span style="font-size: 12px; color: #5B6967">no record has 2 tags</span></div></div>
</sc-if>
<section style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0"><div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><h2 style="margin: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700">Tags</h2><span style="font-size: 12px; color: #5B6967; text-align: right">A record with 2 tags shows in both rows</span></div><div style="display: flex; flex-direction: column; gap: 4px; margin: 0 -8px"><sc-if value="{{hasTags}}" hint-placeholder-val="{{ true }}"><div style="display: flex; align-items: center; gap: 6px"><a href="Records.html" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 8px; border-radius: 8px; text-decoration: none; color: #15201F"><span style="display: flex; justify-content: space-between; gap: 10px"><span style="display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 500"><span><span style="font-size: 11px; padding: 1px 7px; border-radius: 99px; background: #DCEDED; color: #0B6E73; font-weight: 600">#flights</span></span></span><span style="font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; color: #15201F">₹23,580</span></span><span style="font-size: 12px; color: #5B6967">3 records · 8 Jul – 16 Sep</span></a><sc-if value="{{confirming}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{del}}" style="border: 0; border-radius: 9px; padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; background: #B23A3A; color: #FFFFFF">Delete #flights</button><button type="button" onClick="{{cancel}}" style="border: 0; border-radius: 9px; padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; background: #E8EDEB; color: #15201F">Cancel</button></sc-if><sc-if value="{{notConfirming}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ask}}" aria-label="Delete tag flights" style="border: 0; border-radius: 9px; padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; background: #E8EDEB; color: #15201F">Delete…</button></sc-if></div></sc-if><sc-if value="{{noTags}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 8px; font-size: 14px; color: #5B6967">No tags yet. Tag a trip above, or add tags on a record.</p></sc-if></div><sc-if value="{{delMsg}}" hint-placeholder-val="{{ false }}"><div role="status" style="font-size: 13px; padding: 10px 12px; border-radius: 8px; background: #15201F; color: #F2F5F4">{{delMsg}}</div></sc-if>
</section>
  </main>
  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #D9E0DE; padding: 4px 2px 20px"><a href="Home.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #0B6E73; font-weight: 600"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Home</a><a href="Records.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>Records</a><a href="Inbox.html" aria-label="Inbox, 4 items" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h5l1.5 3h5l1.5-3h5M5.5 5h13L21 13v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/></svg><span aria-hidden="true" style="position: absolute; top: -4px; left: 14px; min-width: 17px; height: 17px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #9A6212; color: #FFFFFF; font-size: 10px; font-weight: 700; line-height: 17px; text-align: center">4</span></span>Inbox</a><a href="Main.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg></span>Ask</a><a href="More.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span>More</a></nav>
</div></template>
<script type="text/plain" id="ll-logic" data-props='{}'>
class Component extends DCLogic {
  state = { tag: '', msg: '', confirm: false, deleted: false, delMsg: '' };
  renderVals() {
    const tag = this.state.tag.trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-');
    const { confirm, deleted } = this.state;
    return { tag: this.state.tag, msg: this.state.msg, onTag: ev => this.setState({ tag: ev.target.value, msg: '' }),
      save: () => this.setState({ msg: tag ? '#' + tag + ' added to 5 records.' : 'Type a tag name first.' }),
      hasTags: !deleted, noTags: deleted, confirming: confirm, notConfirming: !confirm, delMsg: this.state.delMsg,
      ask: () => this.setState({ confirm: true }),
      cancel: () => this.setState({ confirm: false }),
      del: () => this.setState({ confirm: false, deleted: true, delMsg: '#flights deleted from 3 records.' }) };
  }
}
</script>
<div id="ll-root"></div>
<script src="../assets/ll-runtime.js"></script>
</div>
</body>
</html>
