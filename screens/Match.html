<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links: match by hand · Ledgerlight prototype</title>
<style>
body{margin:0}
a{color:#0B6E73}a:hover{color:#08575B}
</style>
<style>
html{background:#E4EAE8}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0 32px;box-sizing:border-box;
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
.ll-bar{width:390px;max-width:100%;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#3F4B49}
.ll-bar a{color:#0B6E73;text-decoration:none;font-weight:600}
.ll-phone{border-radius:28px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 40px rgba(16,40,38,.18);background:#F2F5F4}
@media (max-width:420px){body{padding:0}.ll-bar{padding:10px 12px;box-sizing:border-box}.ll-phone{border-radius:0;box-shadow:none}}
html.thumb,html.thumb body{background:#F2F5F4;padding:0;display:block;min-height:0}
html.thumb .ll-bar{display:none}
/* Rows inside the scrolling main must keep their height (chip rows use overflow-x). */
.ll-phone main > *{flex-shrink:0}
html.thumb .ll-phone{border-radius:0;box-shadow:none}
</style>
<script>if(location.hash==='#thumb')document.documentElement.classList.add('thumb')</script>
</head>
<body>
<div class="ll-bar"><a href="../index.html">← All screens</a><span>Links: match by hand</span></div>
<div class="ll-phone">
<template id="ll-tpl"><div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F5F4; color: #15201F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #D9E0DE; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; border-radius: 6px; background: #0B6E73; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">₹</span>
      <a href="Links.html" aria-label="Back" style="flex: none; width: 36px; height: 40px; margin-left: -6px; display: flex; align-items: center; justify-content: center; color: #15201F; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
      <h1 style="margin: 0; flex-grow: 1; min-width: 0; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Links</h1>
    </div>
    
  </header>
  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><a href="Links.html" style="display: inline-flex; align-items: center; border-radius: 9px; padding: 11px 16px; font-size: 15px; font-weight: 600; background: #E8EDEB; color: #15201F; text-decoration: none; white-space: nowrap">← Back</a><span style="font-size: 13px; color: #5B6967">Pick the record that pairs with this one</span></div>
    <section style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0"><div style="display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; background: #E8EDEB; border-radius: 8px; padding: 10px 12px; min-width: 0"><span style="font-size: 12px; color: #5B6967; font-weight: 600">{{me.title}}</span><div style="display: flex; justify-content: space-between; gap: 8px"><b style="min-width: 0">{{me.name}}</b><b style="font-variant-numeric: tabular-nums; white-space: nowrap">{{me.amt}}</b></div><dl style="display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; margin: 0; font-size: 13px"><dt style="color: #5B6967">Date</dt><dd style="margin: 0; min-width: 0">{{me.date}}</dd><dt style="color: #5B6967">Account</dt><dd style="margin: 0; min-width: 0">{{me.acct}}</dd><dt style="color: #5B6967">Category</dt><dd style="margin: 0; min-width: 0">{{me.cat}}</dd><dt style="color: #5B6967">Statement</dt><dd style="margin: 0; min-width: 0; overflow-wrap: anywhere; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px">{{me.stmt}}</dd></dl><details><summary style="cursor: pointer; font-size: 13px; color: #0B6E73; font-weight: 600">Original row from the statement</summary><div style="margin-top: 6px; display: grid; gap: 4px; font-size: 13px"><div style="font-size: 12px; color: #5B6967">{{me.file}} · PDF line, as the parser read it</div><div style="display: grid; grid-template-columns: auto minmax(0, 1fr); font-size: 12px; background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 6px"><sc-for list="{{me.cells}}" as="c" hint-placeholder-count="4"><span style="font-weight: 500; color: #5B6967; padding: 4px 8px; white-space: nowrap; border-top: {{c.border}}">{{c.k}}</span><span style="padding: 4px 8px; overflow-wrap: anywhere; border-top: {{c.border}}; font-family: ui-monospace, 'SF Mono', Menlo, monospace; min-width: 0">{{c.v}}</span></sc-for></div></div></details></div><div role="group" aria-label="This is a" style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center"><span style="font-size: 13px; color: #5B6967">This is a</span>
        <sc-for list="{{types}}" as="s" hint-placeholder-count="3"><button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="border: 1px solid {{s.bd}}; background: {{s.bgc}}; color: {{s.fg}}; border-radius: 99px; padding: 6px 13px; font: inherit; font-size: 13px">{{s.label}}</button></sc-for></div>
      <div style="display: flex; align-items: center; gap: 8px"><label style="flex-grow: 1; min-width: 0; display: flex; align-items: center; background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 0 12px"><input aria-label="Search" placeholder="Shop or amount · 90 days" value="{{q}}" onChange="{{onQ}}" style="border: 0; background: none; padding: 11px 0; flex-grow: 1; width: 100%; min-width: 0; font: inherit; font-size: 16px; color: #15201F; outline: none"></label>
        <select aria-label="Days" style="border: 1px solid #D9E0DE; background: #FFFFFF; border-radius: 99px; padding: 6px 10px; font: inherit; font-size: 13px; color: #15201F"><option>30d</option><option selected>90d</option><option>180d</option><option>365d</option></select>
        <button type="button" style="border: 0; border-radius: 9px; padding: 11px 16px; font: inherit; font-weight: 600; background: #0B6E73; color: #FFFFFF">Search</button></div></section>
    <span style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #5B6967; font-weight: 600">Purchases · tap one</span>
    <div style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; overflow: hidden">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4"><button type="button" onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 0; border-top: {{r.border}}; background: {{r.bg}}; font: inherit; text-align: left; color: #15201F">
        <span style="min-width: 0"><span style="display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.tick}}{{r.name}}</span><span style="font-size: 12px; color: #5B6967">{{r.date}} · {{r.acct}} · {{r.cat}} · same shop</span>
          <span style="display: block; font-size: 12px; color: #5B6967; font-family: ui-monospace, 'SF Mono', Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.stmt}}</span></span>
        <span style="font-weight: 600; font-variant-numeric: tabular-nums">{{r.amt}}</span></button></sc-for>
      <sc-if value="{{none}}" hint-placeholder-val="{{ false }}"><div style="padding: 32px 16px; text-align: center; color: #5B6967">Nothing found. Try a shop name, an amount, or more days.</div></sc-if>
    </div>
    <sc-if value="{{sel}}" hint-placeholder-val="{{ true }}"><section style="position: sticky; bottom: 8px; background: #FFFFFF; border: 1px solid #0B6E73; border-radius: 10px; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px"><div style="display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; background: #E8EDEB; border-radius: 8px; padding: 10px 12px; min-width: 0"><span style="font-size: 12px; color: #5B6967; font-weight: 600">{{pick.title}}</span><div style="display: flex; justify-content: space-between; gap: 8px"><b style="min-width: 0">{{pick.name}}</b><b style="font-variant-numeric: tabular-nums; white-space: nowrap">{{pick.amt}}</b></div><dl style="display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; margin: 0; font-size: 13px"><dt style="color: #5B6967">Date</dt><dd style="margin: 0; min-width: 0">{{pick.date}}</dd><dt style="color: #5B6967">Account</dt><dd style="margin: 0; min-width: 0">{{pick.acct}}</dd><dt style="color: #5B6967">Category</dt><dd style="margin: 0; min-width: 0">{{pick.cat}}</dd><dt style="color: #5B6967">Statement</dt><dd style="margin: 0; min-width: 0; overflow-wrap: anywhere; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px">{{pick.stmt}}</dd></dl><details><summary style="cursor: pointer; font-size: 13px; color: #0B6E73; font-weight: 600">Original row from the statement</summary><div style="margin-top: 6px; display: grid; gap: 4px; font-size: 13px"><div style="font-size: 12px; color: #5B6967">{{pick.file}} · PDF line, as the parser read it</div><div style="display: grid; grid-template-columns: auto minmax(0, 1fr); font-size: 12px; background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 6px"><sc-for list="{{pick.cells}}" as="c" hint-placeholder-count="4"><span style="font-weight: 500; color: #5B6967; padding: 4px 8px; white-space: nowrap; border-top: {{c.border}}">{{c.k}}</span><span style="padding: 4px 8px; overflow-wrap: anywhere; border-top: {{c.border}}; font-family: ui-monospace, 'SF Mono', Menlo, monospace; min-width: 0">{{c.v}}</span></sc-for></div></div></details></div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px"><span style="font-size: 14px">{{typeLabel}} of <b>{{selMax}}</b> of the {{selAmt}} purchase</span>
        <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5B6967">Amount<input inputmode="decimal" value="{{selVal}}" style="width: 7.5em; border: 1px solid #D9E0DE; background: #FFFFFF; border-radius: 99px; padding: 6px 10px; font: inherit; font-size: 13px; color: #15201F"></label></div>
      <a href="RefundDone.html" style="display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 9px; padding: 11px 16px; font: inherit; font-size: 15px; font-weight: 600; background: #0B6E73; color: #FFFFFF; text-decoration: none; white-space: nowrap">Link</a></section></sc-if>
  </main>
  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #D9E0DE; padding: 4px 2px 20px"><a href="Home.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Home</a><a href="Records.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>Records</a><a href="Inbox.html" aria-current="page" aria-label="Inbox, 4 items" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #0B6E73; font-weight: 600"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h5l1.5 3h5l1.5-3h5M5.5 5h13L21 13v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/></svg><span aria-hidden="true" style="position: absolute; top: -4px; left: 14px; min-width: 17px; height: 17px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #9A6212; color: #FFFFFF; font-size: 10px; font-weight: 700; line-height: 17px; text-align: center">4</span></span>Inbox</a><a href="Main.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg></span>Ask</a><a href="More.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; text-decoration: none; color: #5B6967; font-weight: 400"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span>More</a></nav>
</div></template>
<script type="text/plain" id="ll-logic" data-props='{}'>
class Component extends DCLogic {
  state = { q: '', sel: 133, type: 'refund' };
  renderVals() {
    // The fields of a PDF statement line, as the parser reads them (invented test data).
    const cells = (d, text, amt, dc) => [['Date', d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4)], ['Narration', text], ['Amount', amt], ['Debit / credit', dc]].map(([k, v], i) => ({ k, v, border: i ? '1px solid #D9E0DE' : '0' }));
    const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dlabel = d => { const x = new Date(d + 'T00:00'); return DOW[x.getDay()] + ', ' + x.getDate() + ' ' + MON[x.getMonth()] + ' ' + x.getFullYear(); };
    const s = this.state, q = s.q.trim().toLowerCase(), ALL = [
      { id: 133, name: 'Uber Systems Corvel', d: '2026-09-10', cat: 'Transport', stmt: 'UBER SYSTEMS CORVEL', amt: '₹404', v: '404.00', max: '₹404' },
      { id: 131, name: 'Uber Systems Corvel', d: '2026-09-09', cat: 'Transport', stmt: 'UBER SYSTEMS CORVEL', amt: '₹627', v: '627.00', max: '₹627' },
      { id: 126, name: 'Brightway Corvel', d: '2026-09-16', cat: 'Shopping', stmt: 'Brightway INDIA PVT LTD CORVEL', amt: '₹5,220', v: '5,220.00', max: '₹1,299' },
      { id: 127, name: 'Brightway Corvel', d: '2026-09-07', cat: 'Shopping', stmt: 'Brightway INDIA PVT LTD CORVEL', amt: '₹4,600', v: '4,600.00', max: '₹1,299' },
      { id: 125, name: 'Brightway Corvel', d: '2026-09-06', cat: 'Shopping', stmt: 'Brightway INDIA PVT LTD CORVEL', amt: '₹4,460', v: '4,460.00', max: '₹1,299' },
      { id: 129, name: 'Uber Systems Corvel', d: '2026-09-06', cat: 'Transport', stmt: 'UBER SYSTEMS CORVEL', amt: '₹374', v: '374.00', max: '₹374' },
      { id: 136, name: 'Uber Systems Corvel', d: '2026-09-22', cat: 'Transport', stmt: 'UBER SYSTEMS CORVEL', amt: '₹577', v: '577.00', max: '₹577' }]
      .map(r => ({ ...r, date: dlabel(r.d), acct: 'Test Bank Platinum', file: 'demo_card_0001.pdf', cells: cells(r.d, r.stmt, r.v, 'Dr') }));
    const me = { title: 'This credit', name: 'Brightway Refund', amt: '+₹1,299', date: 'Sat, 12 Sep 2026', acct: 'Test Bank Platinum', cat: 'Refunds',
      stmt: 'Brightway INDIA REFUND', file: 'demo_card_0001.pdf', cells: cells('2026-09-12', 'Brightway INDIA REFUND', '1,299.00', 'Cr') };
    const rows = ALL.filter(r => !q || r.name.toLowerCase().includes(q) || r.amt.replace(/[₹,]/g, '').includes(q)).map((r, i) => ({ ...r,
      on: String(r.id === s.sel), bg: r.id === s.sel ? '#DCEDED' : '#FFFFFF', tick: r.id === s.sel ? '✓ ' : '', border: i ? '1px solid #D9E0DE' : '0',
      pick: () => this.setState({ sel: s.sel === r.id ? null : r.id }) }));
    const sel = ALL.find(r => r.id === s.sel);
    const TYPES = [['refund', 'Refund'], ['card_payment', 'Card bill payment'], ['transfer', 'Own transfer']];
    const types = TYPES.map(([k, l]) => ({ label: l, on: String(k === s.type),
      bgc: k === s.type ? '#15201F' : '#FFFFFF', fg: k === s.type ? '#F2F5F4' : '#15201F', bd: k === s.type ? '#15201F' : '#D9E0DE', pick: () => this.setState({ type: k }) }));
    return { me, q: s.q, onQ: ev => this.setState({ q: ev.target.value }), rows, none: !rows.length, types, sel: !!sel,
      pick: sel ? { ...sel, title: 'You picked' } : {}, typeLabel: TYPES.find(t => t[0] === s.type)[1],
      selMax: sel ? sel.max : '', selAmt: sel ? sel.amt : '', selVal: sel ? sel.max.replace(/[₹,]/g, '') + '.00' : '' };
  }
}
</script>
<div id="ll-root"></div>
<script src="../assets/ll-runtime.js"></script>
</div>
</body>
</html>
