<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links: match by hand · Ledgerlight prototype</title>
<style>
body{margin:0}
a{color:#0B6E73}a:hover{color:#08575B}
</style>
<style>
html{background:#E4EAE8}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0 32px;box-sizing:border-box;
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
.ll-bar{width:390px;max-width:100%;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#3F4B49}
.ll-bar a{color:#0B6E73;text-decoration:none;font-weight:600}
.ll-phone{border-radius:28px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 40px rgba(16,40,38,.18);background:#F2F5F4}
@media (max-width:420px){body{padding:0}.ll-bar{padding:10px 12px;box-sizing:border-box}.ll-phone{border-radius:0;box-shadow:none}}
html.thumb,html.thumb body{background:#F2F5F4;padding:0;display:block;min-height:0}
html.thumb .ll-bar{display:none}
html.thumb .ll-phone{border-radius:0;box-shadow:none}
</style>
<script>if(location.hash==='#thumb')document.documentElement.classList.add('thumb')</script>
</head>
<body>
<div class="ll-bar"><a href="../index.html">← All screens</a><span>Links: match by hand</span></div>
<div class="ll-phone">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F5F4; color: #15201F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #D9E0DE">

    <h1 style="margin: 0; font-size: 20px; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">Find a match</h1>
  </header>
  <main style="flex-grow: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <section style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; gap: 8px">
      <span><b>Tata 1mg</b><br><span style="font-size: 12px; color: #5B6967">Credit · 2 Oct · Test card ··0001</span></span><b style="color: #24794A; font-variant-numeric: tabular-nums">+₹261</b>
    </section>

    <div role="group" aria-label="This credit is" style="display: flex; gap: 6px; flex-wrap: wrap">
      <span style="font-size: 13px; color: #5B6967; align-self: center">This is a</span>
      <button type="button" aria-pressed="true" style="font: inherit; font-size: 14px; background: #0B6E73; color: #FFFFFF; border: 0; border-radius: 999px; padding: 7px 12px">Refund</button>
      <button type="button" aria-pressed="false" style="font: inherit; font-size: 14px; background: #FFFFFF; color: #15201F; border: 1px solid #D9E0DE; border-radius: 999px; padding: 7px 12px">Card bill payment</button>
      <button type="button" aria-pressed="false" style="font: inherit; font-size: 14px; background: #FFFFFF; color: #15201F; border: 1px solid #D9E0DE; border-radius: 999px; padding: 7px 12px">Own transfer</button>
    </div>

    <label style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 10px; padding: 0 10px; min-height: 44px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6967" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input aria-label="Search purchases" placeholder="Shop or amount · last 90 days" value="1mg" style="font: inherit; border: 0; outline: 0; flex-grow: 1; min-width: 0; background: transparent; color: #15201F">
    </label>

    <div style="font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #5B6967; font-weight: 600">Purchases · tap one</div>
    <div style="background: #FFFFFF; border: 1px solid #D9E0DE; border-radius: 12px; display: flex; flex-direction: column">
      <button type="button" style="font: inherit; text-align: left; background: #DCEDED; color: #15201F; border: 0; border-bottom: 1px solid #ECF0EF; padding: 12px 14px; display: flex; justify-content: space-between; gap: 8px"><span>✓ Tata 1mg · 20 Sep<br><span style="font-size: 12px; color: #5B6967">Health · Test card ··0001</span></span><span style="font-variant-numeric: tabular-nums">₹980</span></button>
      <button type="button" style="font: inherit; text-align: left; background: #FFFFFF; color: #15201F; border: 0; border-bottom: 1px solid #ECF0EF; padding: 12px 14px; display: flex; justify-content: space-between; gap: 8px"><span>Tata 1mg · 2 Aug<br><span style="font-size: 12px; color: #5B6967">Health · Test card ··0001</span></span><span style="font-variant-numeric: tabular-nums">₹1,450</span></button>
      <button type="button" style="font: inherit; text-align: left; background: #FFFFFF; color: #15201F; border: 0; padding: 12px 14px; display: flex; justify-content: space-between; gap: 8px"><span>Tata 1mg · 11 Jul<br><span style="font-size: 12px; color: #5B6967">Health · Test card ··0001 · ₹1,700 already refunded</span></span><span style="font-variant-numeric: tabular-nums">₹647</span></button>
    </div>
  </main>
  <div style="background: #FFFFFF; border-top: 1px solid #D9E0DE; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 14px">
      <span style="flex-grow: 1">Refund ₹261 of the ₹980 purchase</span>
      <label style="display: flex; align-items: center; gap: 6px; color: #5B6967">Amount<input aria-label="Amount" value="240.00" inputmode="decimal" style="font: inherit; width: 84px; border: 1px solid #D9E0DE; border-radius: 8px; padding: 7px 8px; color: #15201F; text-align: right"></label>
    </div>
    <a href="RefundDone.html" style="text-align: center; background: #0B6E73; color: #FFFFFF; text-decoration: none; font-weight: 600; border-radius: 10px; padding: 13px 8px">Link</a>
  </div>
  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #D9E0DE; padding: 6px 4px 20px">
    <a href="Home.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; font-size: 11px; color: #5B6967; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="Records.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; font-size: 11px; color: #5B6967; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Records</a>
    <a href="Inbox.html" aria-current="page" aria-label="Inbox, 13 items" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; font-size: 11px; color: #0B6E73; font-weight: 700; text-decoration: none"><span style="position: relative; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 13h5l1.5 3h5l1.5-3h5M5.5 5h13L21 13v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/></svg><span aria-hidden="true" style="position: absolute; top: -5px; left: 13px; min-width: 18px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #B23A3A; color: #FFFFFF; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center">13</span></span>Inbox</a>
    <a href="Main.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; font-size: 11px; color: #5B6967; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg>Ask</a>
    <a href="More.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; font-size: 11px; color: #5B6967; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</a>
  </nav>
</div>
</div>
</body>
</html>
